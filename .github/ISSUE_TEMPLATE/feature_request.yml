name: Feature request
description: Something urga should do and does not.
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What you want to do
      description: The task in the cluster, not the key or the screen. For example, "see which allocations of a job restarted in the last hour".
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: With the nomad command, the web UI, or not at all.
  - type: textarea
    id: idea
    attributes:
      label: How urga could do it
      description: A key, a column, a screen. Leave it empty if you do not know.
