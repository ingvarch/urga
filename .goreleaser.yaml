# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: urga

builds:
  - main: ./cmd/urga
    binary: urga
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/ingvarch/urga/internal/version.Version=v{{ .Version }}
      - -X github.com/ingvarch/urga/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/ingvarch/urga/internal/version.Date={{ .Date }}
    # arm is v7, the level Go picks when it cross-compiles.
    targets:
      - linux_amd64_v1
      - linux_arm64_v8.0
      - linux_arm_7
      - darwin_amd64_v1
      - darwin_arm64_v8.0
      - windows_amd64_v1
      - windows_arm64_v8.0
      - freebsd_amd64_v1

# Gatekeeper runs a downloaded binary only once Apple has notarized it. A
# snapshot has no Apple keys, a release fails without them.
notarize:
  macos:
    - enabled: "{{ not .IsSnapshot }}"
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m

archives:
  # A zip for Windows, a tarball everywhere else.
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

changelog:
  use: github-native

nfpms:
  - vendor: Igor Churmeev
    maintainer: Igor Churmeev <ingvarch@gmail.com>
    homepage: &homepage https://github.com/ingvarch/urga
    description: &description Terminal UI for HashiCorp Nomad
    license: &license MIT
    file_name_template: "{{ .ConventionalFileName }}"
    formats:
      - deb
      - rpm
    contents:
      - src: LICENSE
        dst: /usr/share/doc/urga/LICENSE

homebrew_casks:
  - homepage: *homepage
    description: *description
    license: *license
    skip_upload: auto
    repository:
      owner: ingvarch
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
